name: publish plugin release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read plugin version
        id: version
        run: |
          version="$(python -c 'import json; p="plugins/you-suck-at-prompting/"; g=json.load(open(p+"plugin.json")); c=json.load(open(p+".codex-plugin/plugin.json")); a=json.load(open(p+".claude-plugin/plugin.json")); assert g["name"] == c["name"] == a["name"], "Agent Plugins, Codex, and Claude names differ"; assert g["version"] == c["version"] == a["version"], "Agent Plugins, Codex, and Claude versions differ"; print(c["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "You Suck at Prompting $tag" \
            --generate-notes
