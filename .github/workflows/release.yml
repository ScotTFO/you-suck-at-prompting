name: publish skill release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read VERSION
        id: version
        run: |
          version="$(python -c 'import pathlib,re; raw=pathlib.Path("VERSION").read_text(encoding="utf-8"); assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+\n?", raw), "VERSION must be strict stable semver"; print(raw.strip())')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "You Suck at Prompting $tag" \
            --generate-notes
