name: validate plugin package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Install pinned Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.212
      - name: Validate release-only package
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          import yaml

          root = Path.cwd()
          plugin_root = root / "plugins" / "you-suck-at-prompting"
          manifest_path = plugin_root / ".codex-plugin" / "plugin.json"
          marketplace_path = root / ".agents" / "plugins" / "marketplace.json"
          claude_manifest_path = plugin_root / ".claude-plugin" / "plugin.json"
          claude_marketplace_path = root / ".claude-plugin" / "marketplace.json"
          skill_root = plugin_root / "skills" / "you-suck-at-prompting"
          skill_path = skill_root / "SKILL.md"
          openai_path = skill_root / "agents" / "openai.yaml"
          hook_path = plugin_root / "hooks" / "hooks.json"
          hook_test_path = root / "tests" / "test_prompt_hook.py"

          required = [
              manifest_path, marketplace_path, claude_manifest_path, claude_marketplace_path,
              skill_path, openai_path, hook_path, hook_test_path,
              root / "README.md", root / "LICENSE",
          ]
          missing = [str(path.relative_to(root)) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))

          allowed_root = {".agents", ".claude-plugin", ".github", "plugins", "tests", "README.md", "LICENSE"}
          unexpected = sorted(path.name for path in root.iterdir() if path.name not in allowed_root and path.name != ".git")
          if unexpected:
              raise SystemExit("Unexpected release-root entries: " + ", ".join(unexpected))

          forbidden_parts = {"evals", "eval-workbench", "dashboard", "results", "candidates", "state", "source-cache", "__pycache__"}
          leaked_paths = []
          for path in root.rglob("*"):
              if ".git" in path.parts:
                  continue
              if any(part.lower() in forbidden_parts for part in path.relative_to(root).parts):
                  leaked_paths.append(str(path.relative_to(root)))
          if leaked_paths:
              raise SystemExit("Private or generated paths are not releasable: " + ", ".join(leaked_paths))

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          marketplace = json.loads(marketplace_path.read_text(encoding="utf-8"))
          claude_manifest = json.loads(claude_manifest_path.read_text(encoding="utf-8"))
          claude_marketplace = json.loads(claude_marketplace_path.read_text(encoding="utf-8"))
          if manifest.get("name") != "you-suck-at-prompting" or manifest.get("skills") != "./skills/":
              raise SystemExit("Plugin identity or skills path is invalid")
          version = str(manifest.get("version", ""))
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Plugin version must be strict stable semver")
          if claude_manifest.get("name") != manifest.get("name") or claude_manifest.get("version") != version:
              raise SystemExit("Codex and Claude plugin identities or versions differ")
          if "hooks" in claude_manifest or "skills" in claude_manifest:
              raise SystemExit("Claude must use default hook and skill discovery")
          if claude_manifest.get("author") != {"name": "ScotTFO"}:
              raise SystemExit("Claude author metadata must remain strict-validator compatible")
          if manifest.get("author", {}).get("name") != "ScotTFO":
              raise SystemExit("Plugin author metadata is incomplete")
          interface = manifest.get("interface", {})
          for key in ("displayName", "shortDescription", "longDescription", "developerName", "category"):
              if not isinstance(interface.get(key), str) or not interface[key].strip():
                  raise SystemExit(f"Plugin interface.{key} is required")
          prompts = interface.get("defaultPrompt")
          if not isinstance(prompts, list) or not 1 <= len(prompts) <= 3 or any(not isinstance(p, str) or len(p) > 128 for p in prompts):
              raise SystemExit("Plugin starter prompts must contain one to three strings of at most 128 characters")
          for unsupported in ("mcpServers", "apps", "hooks"):
              if unsupported in manifest:
                  raise SystemExit(f"Plugin manifest must not declare {unsupported}; use default companion-file discovery")

          hook_config = json.loads(hook_path.read_text(encoding="utf-8"))
          if set(hook_config) != {"description", "hooks"}:
              raise SystemExit("Hook config may contain only description and hooks")
          hooks = hook_config.get("hooks")
          if not isinstance(hooks, dict) or set(hooks) != {"UserPromptSubmit"}:
              raise SystemExit("Plugin must contain only the UserPromptSubmit hook")
          groups = hooks["UserPromptSubmit"]
          if not isinstance(groups, list) or len(groups) != 1 or set(groups[0]) != {"hooks"}:
              raise SystemExit("UserPromptSubmit must have one matcher-free hook group")
          handlers = groups[0].get("hooks")
          if not isinstance(handlers, list) or len(handlers) != 1:
              raise SystemExit("UserPromptSubmit must have exactly one handler")
          handler = handlers[0]
          expected_context = (
              "Rewrite every task visibly before acting, even clear or trivial ones. Show `Rewritten prompt:` and "
              "end with exact standalone line `Reply APPROVE to use this prompt.` Do no underlying work. If "
              "required information is missing, show `Draft rewritten prompt:` with `[NEEDED: ...]`, ask one "
              "focused question, and omit approval. Treat answers as revisions and exact `APPROVE` as execution "
              "of the latest complete rewrite. Preserve intent, privacy, policy, and authority; approval never "
              "authorizes separate effects."
          )
          if len(expected_context) > 512:
              raise SystemExit("Prompt hook context exceeds additionalContextLimit")
          expected_handler = {
              "type": "command",
              "command": f"echo '{expected_context}'",
              "commandWindows": (
                  "powershell.exe -NoProfile -NonInteractive -Command "
                  f'"[Console]::Out.WriteLine(\'{expected_context}\')"'
              ),
              "timeout": 5,
              "additionalContextLimit": 512,
          }
          if handler != expected_handler:
              raise SystemExit("Prompt hook must remain a bounded constant-output command")

          if marketplace.get("name") != "scottfo":
              raise SystemExit("Marketplace ID must be scottfo")
          entries = marketplace.get("plugins")
          if not isinstance(entries, list) or len(entries) != 1:
              raise SystemExit("Marketplace must publish exactly one plugin")
          entry = entries[0]
          expected_entry = {
              "name": "you-suck-at-prompting",
              "source": {"source": "local", "path": "./plugins/you-suck-at-prompting"},
              "policy": {"installation": "AVAILABLE", "authentication": "ON_INSTALL"},
              "category": "Productivity",
          }
          if entry != expected_entry:
              raise SystemExit("Marketplace entry does not match the release contract")

          if claude_marketplace.get("name") != "scottfo" or claude_marketplace.get("owner") != {"name": "ScotTFO"}:
              raise SystemExit("Claude marketplace identity is invalid")
          claude_entries = claude_marketplace.get("plugins")
          if not isinstance(claude_entries, list) or len(claude_entries) != 1:
              raise SystemExit("Claude marketplace must publish exactly one plugin")
          claude_entry = claude_entries[0]
          if claude_entry.get("name") != "you-suck-at-prompting" or claude_entry.get("source") != "./plugins/you-suck-at-prompting":
              raise SystemExit("Claude marketplace entry does not match the release contract")
          if "version" in claude_entry:
              raise SystemExit("Claude marketplace must not duplicate the manifest version")

          skill_text = skill_path.read_text(encoding="utf-8")
          if not skill_text.startswith("---\n") or "\n---\n" not in skill_text[4:]:
              raise SystemExit("SKILL.md frontmatter is missing")
          _, frontmatter, body = skill_text.split("---\n", 2)
          skill_meta = yaml.safe_load(frontmatter)
          if skill_meta.get("name") != "you-suck-at-prompting" or not skill_meta.get("description"):
              raise SystemExit("SKILL.md name or description is invalid")
          if set(skill_meta) != {"name", "description"}:
              raise SystemExit("SKILL.md frontmatter may contain only name and description")
          for reference in re.findall(r"\((references/[^)]+\.md)\)", body):
              if not (skill_root / reference).is_file():
                  raise SystemExit(f"Broken skill reference: {reference}")

          openai = yaml.safe_load(openai_path.read_text(encoding="utf-8"))
          if openai.get("policy", {}).get("allow_implicit_invocation") is not True:
              raise SystemExit("Implicit invocation must remain enabled")
          default_prompt = openai.get("interface", {}).get("default_prompt", "")
          if "$you-suck-at-prompting" not in default_prompt:
              raise SystemExit("Skill default prompt must name $you-suck-at-prompting")

          scan_paths = [root / "README.md"] + [p for p in plugin_root.rglob("*") if p.is_file()]
          secret_patterns = [r"gh[pousr]_[A-Za-z0-9_]{20,}", r"sk-[A-Za-z0-9_-]{20,}", r"-----BEGIN [A-Z ]*PRIVATE KEY-----"]
          local_path_patterns = [r"[A-Za-z]:\\", r"C:/Users/", r"/Users/[^/]+/", r"/home/[^/]+/"]
          for path in scan_paths:
              text = path.read_text(encoding="utf-8", errors="replace")
              if any(re.search(pattern, text) for pattern in secret_patterns + local_path_patterns):
                  raise SystemExit(f"Secret-like content or a private local path appears in {path.relative_to(root)}")

          if os.environ.get("EVENT_NAME") == "pull_request":
              base_ref = os.environ["BASE_REF"]
              base_manifest = subprocess.check_output(
                  ["git", "show", f"origin/{base_ref}:plugins/you-suck-at-prompting/.codex-plugin/plugin.json"],
                  text=True,
              )
              base_version = json.loads(base_manifest)["version"]
              current = tuple(map(int, version.split(".")))
              previous = tuple(map(int, base_version.split(".")))
              if current <= previous:
                  raise SystemExit(f"Plugin version {version} must be greater than base {base_version}")

              if os.environ.get("HEAD_REF", "").startswith("codex/skill-improvement-"):
                  changed = subprocess.check_output(
                      ["git", "diff", "--name-only", f"origin/{base_ref}...HEAD"], text=True
                  ).splitlines()
                  allowed_exact = {
                      "plugins/you-suck-at-prompting/.codex-plugin/plugin.json",
                      "plugins/you-suck-at-prompting/.claude-plugin/plugin.json",
                      "plugins/you-suck-at-prompting/skills/you-suck-at-prompting/SKILL.md",
                      "plugins/you-suck-at-prompting/skills/you-suck-at-prompting/agents/openai.yaml",
                  }
                  reference_prefix = "plugins/you-suck-at-prompting/skills/you-suck-at-prompting/references/"
                  invalid = [
                      path for path in changed
                      if path not in allowed_exact
                      and not (path.startswith(reference_prefix) and path.endswith(".md"))
                  ]
                  if invalid:
                      raise SystemExit("Automated improvement PR changed non-release paths: " + ", ".join(invalid))

          print(f"Validated you-suck-at-prompting {version} as a release-only prompt-preflight plugin")
          PY
      - name: Validate Claude Code plugin and marketplace contracts
        run: |
          claude plugin validate plugins/you-suck-at-prompting --strict
          claude plugin validate . --strict

  hook-runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Exercise prompt hook without retaining its input
        run: python -m unittest tests.test_prompt_hook
