name: validate plugin package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Install pinned Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.212
      - name: Validate release-only selective package
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          import yaml

          root = Path.cwd()
          plugin_root = root / "plugins" / "you-suck-at-prompting"
          skill_root = plugin_root / "skills" / "you-suck-at-prompting"
          agent_plugin_path = plugin_root / "plugin.json"
          codex_manifest_path = plugin_root / ".codex-plugin" / "plugin.json"
          claude_manifest_path = plugin_root / ".claude-plugin" / "plugin.json"
          agent_marketplace_path = root / ".agents" / "plugins" / "marketplace.json"
          claude_marketplace_path = root / ".claude-plugin" / "marketplace.json"
          skill_path = skill_root / "SKILL.md"
          openai_path = skill_root / "agents" / "openai.yaml"
          contract_test_path = root / "tests" / "test_plugin_contract.py"

          required = [
              agent_plugin_path,
              codex_manifest_path,
              claude_manifest_path,
              agent_marketplace_path,
              claude_marketplace_path,
              skill_path,
              openai_path,
              contract_test_path,
              root / "README.md",
              root / "LICENSE",
          ]
          missing = [
              str(path.relative_to(root))
              for path in required
              if not path.is_file()
          ]
          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))

          forbidden_release_files = [
              plugin_root / "hooks" / "hooks.json",
              plugin_root / "copilot" / "you-suck-at-prompting.instructions.md",
              root / "tests" / "test_prompt_hook.py",
          ]
          present = [
              str(path.relative_to(root))
              for path in forbidden_release_files
              if path.exists()
          ]
          if present:
              raise SystemExit(
                  "Universal interception artifacts must be absent: "
                  + ", ".join(present)
              )

          allowed_root = {
              ".agents",
              ".claude-plugin",
              ".github",
              "docs",
              "plugins",
              "tests",
              "README.md",
              "LICENSE",
          }
          unexpected = sorted(
              path.name
              for path in root.iterdir()
              if path.name not in allowed_root and path.name != ".git"
          )
          if unexpected:
              raise SystemExit(
                  "Unexpected release-root entries: " + ", ".join(unexpected)
              )

          forbidden_parts = {
              "evals",
              "eval-workbench",
              "dashboard",
              "results",
              "candidates",
              "state",
              "source-cache",
              "__pycache__",
          }
          leaked_paths = []
          for path in root.rglob("*"):
              if ".git" in path.parts:
                  continue
              relative = path.relative_to(root)
              if any(part.lower() in forbidden_parts for part in relative.parts):
                  leaked_paths.append(str(relative))
          if leaked_paths:
              raise SystemExit(
                  "Private or generated paths are not releasable: "
                  + ", ".join(leaked_paths)
              )

          agent_plugin = json.loads(agent_plugin_path.read_text(encoding="utf-8"))
          codex = json.loads(codex_manifest_path.read_text(encoding="utf-8"))
          claude = json.loads(claude_manifest_path.read_text(encoding="utf-8"))
          agent_marketplace = json.loads(
              agent_marketplace_path.read_text(encoding="utf-8")
          )
          claude_marketplace = json.loads(
              claude_marketplace_path.read_text(encoding="utf-8")
          )

          if codex.get("name") != "you-suck-at-prompting":
              raise SystemExit("Codex plugin identity is invalid")
          if codex.get("skills") != "./skills/":
              raise SystemExit("Codex skills path is invalid")
          version = str(codex.get("version", ""))
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Plugin version must be strict stable semver")
          if version != "0.8.0":
              raise SystemExit("Selective activation contract must ship as v0.8.0")

          expected_agent_schema = (
              "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json"
          )
          if agent_plugin.get("$schema") != expected_agent_schema:
              raise SystemExit("Portable Agent Plugins manifest schema is invalid")
          identities = {
              (agent_plugin.get("name"), agent_plugin.get("version")),
              (codex.get("name"), codex.get("version")),
              (claude.get("name"), claude.get("version")),
          }
          if identities != {("you-suck-at-prompting", version)}:
              raise SystemExit("Plugin identities or versions differ")

          for label, manifest in (
              ("Agent Plugins", agent_plugin),
              ("Codex", codex),
              ("Claude", claude),
          ):
              description = str(manifest.get("description", "")).casefold()
              if "select" not in description or "material" not in description:
                  raise SystemExit(
                      f"{label} description must describe selective material repair"
                  )
          if "hooks" in agent_plugin or "extensions" in agent_plugin:
              raise SystemExit("Portable manifest must expose only the shared skill")
          if "hooks" in claude or "skills" in claude:
              raise SystemExit("Claude must use default skill discovery")
          if claude.get("author") != {"name": "ScotTFO"}:
              raise SystemExit(
                  "Claude author metadata must remain strict-validator compatible"
              )

          interface = codex.get("interface", {})
          for key in (
              "displayName",
              "shortDescription",
              "longDescription",
              "developerName",
              "category",
          ):
              if not isinstance(interface.get(key), str) or not interface[key].strip():
                  raise SystemExit(f"Plugin interface.{key} is required")
          prompts = interface.get("defaultPrompt")
          if (
              not isinstance(prompts, list)
              or not 1 <= len(prompts) <= 3
              or any(
                  not isinstance(prompt, str)
                  or len(prompt) > 128
                  or "$you-suck-at-prompting" not in prompt
                  for prompt in prompts
              )
          ):
              raise SystemExit(
                  "Starter prompts must explicitly invoke the skill and stay bounded"
              )
          for unsupported in ("mcpServers", "apps", "hooks"):
              if unsupported in codex:
                  raise SystemExit(
                      f"Codex manifest must not declare {unsupported}"
                  )

          if agent_marketplace.get("name") != "scottfo":
              raise SystemExit("Agent Plugins marketplace ID must be scottfo")
          entries = agent_marketplace.get("plugins")
          expected_entry = {
              "name": "you-suck-at-prompting",
              "source": {
                  "source": "local",
                  "path": "./plugins/you-suck-at-prompting",
              },
              "policy": {
                  "installation": "AVAILABLE",
                  "authentication": "ON_INSTALL",
              },
              "category": "Productivity",
          }
          if entries != [expected_entry]:
              raise SystemExit(
                  "Agent Plugins marketplace entry does not match release contract"
              )

          if (
              claude_marketplace.get("name") != "scottfo"
              or claude_marketplace.get("owner") != {"name": "ScotTFO"}
          ):
              raise SystemExit("Claude marketplace identity is invalid")
          claude_entries = claude_marketplace.get("plugins")
          if not isinstance(claude_entries, list) or len(claude_entries) != 1:
              raise SystemExit("Claude marketplace must publish exactly one plugin")
          claude_entry = claude_entries[0]
          if (
              claude_entry.get("name") != "you-suck-at-prompting"
              or claude_entry.get("source")
              != "./plugins/you-suck-at-prompting"
          ):
              raise SystemExit(
                  "Claude marketplace entry does not match release contract"
              )
          claude_description = str(
              claude_entry.get("description", "")
          ).casefold()
          if "select" not in claude_description:
              raise SystemExit(
                  "Claude marketplace must describe selective activation"
              )
          if "version" in claude_entry:
              raise SystemExit(
                  "Claude marketplace must not duplicate the manifest version"
              )

          skill_text = skill_path.read_text(encoding="utf-8")
          if not skill_text.startswith("---\n") or "\n---\n" not in skill_text[4:]:
              raise SystemExit("SKILL.md frontmatter is missing")
          frontmatter, body = skill_text[4:].split("\n---\n", 1)
          skill_meta = yaml.safe_load(frontmatter)
          expected_description = (
              "Use this skill to audit or repair prompts when the user explicitly "
              "asks to write, rewrite, critique, clarify, or quality-check a prompt, "
              "directly invokes You Suck at Prompting, or when a task request has a "
              "material problem such as ambiguity, conflicting constraints, missing "
              "authority, unclear scope or destination, missing success criteria, or "
              "an execution design that could change the outcome. Do not use it for "
              "clear, actionable, exploratory, conversational, or safely discoverable "
              "requests, simple follow-ups or acknowledgements, minor wording issues, "
              "or optional improvements. If no material repair is needed, proceed "
              "silently unless prompt review is the requested deliverable."
          )
          if skill_meta != {
              "name": "you-suck-at-prompting",
              "description": expected_description,
          }:
              raise SystemExit("SKILL.md metadata does not match the public contract")
          for reference in re.findall(r"\((references/[^)]+\.md)\)", body):
              if not (skill_root / reference).is_file():
                  raise SystemExit(f"Broken skill reference: {reference}")

          openai = yaml.safe_load(openai_path.read_text(encoding="utf-8"))
          if (
              openai.get("policy", {}).get("allow_implicit_invocation")
              is not True
          ):
              raise SystemExit("Implicit invocation must remain enabled")
          openai_interface = openai.get("interface", {})
          default_prompt = openai_interface.get("default_prompt", "")
          short_description = openai_interface.get("short_description", "")
          if "$you-suck-at-prompting" not in default_prompt:
              raise SystemExit(
                  "Skill default prompt must name $you-suck-at-prompting"
              )
          if not 25 <= len(short_description) <= 64:
              raise SystemExit("Skill short description must contain 25-64 characters")

          docs = [
              root / "README.md",
              *sorted((root / "docs").glob("*.md")),
              *sorted(skill_root.rglob("*.md")),
          ]
          stale_claims = (
              "audit every task",
              "audit every new task",
              "intercepts every task",
              "rewrite every task",
              "for every new task request",
              "mandatory performance review between",
          )
          stale_hits = []
          for path in docs:
              text = path.read_text(encoding="utf-8").casefold()
              for phrase in stale_claims:
                  if phrase in text:
                      stale_hits.append(f"{path.relative_to(root)}: {phrase}")
          if stale_hits:
              raise SystemExit(
                  "Stale universal-interception claims remain: "
                  + ", ".join(stale_hits)
              )

          scan_paths = docs + [
              path
              for path in plugin_root.rglob("*")
              if path.is_file() and path not in docs
          ]
          secret_patterns = [
              r"gh[pousr]_[A-Za-z0-9_]{20,}",
              r"sk-[A-Za-z0-9_-]{20,}",
              r"-----BEGIN [A-Z ]*PRIVATE KEY-----",
          ]
          local_path_patterns = [
              r"[A-Za-z]:\\",
              r"C:/Users/",
              r"/Users/[^/]+/",
              r"/home/[^/]+/",
          ]
          for path in scan_paths:
              text = path.read_text(encoding="utf-8", errors="replace")
              if any(
                  re.search(pattern, text)
                  for pattern in secret_patterns + local_path_patterns
              ):
                  raise SystemExit(
                      "Secret-like content or a private local path appears in "
                      f"{path.relative_to(root)}"
                  )

          if os.environ.get("EVENT_NAME") == "pull_request":
              base_ref = os.environ["BASE_REF"]
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", f"origin/{base_ref}...HEAD"],
                  text=True,
              ).splitlines()
              release_files = {
                  ".agents/plugins/marketplace.json",
                  ".claude-plugin/marketplace.json",
              }
              release_prefix = "plugins/you-suck-at-prompting/"
              release_changed = any(
                  path in release_files or path.startswith(release_prefix)
                  for path in changed
              )
              if release_changed:
                  base_manifest = subprocess.check_output(
                      [
                          "git",
                          "show",
                          (
                              f"origin/{base_ref}:plugins/you-suck-at-prompting/"
                              ".codex-plugin/plugin.json"
                          ),
                      ],
                      text=True,
                  )
                  base_version = json.loads(base_manifest)["version"]
                  current = tuple(map(int, version.split(".")))
                  previous = tuple(map(int, base_version.split(".")))
                  if current <= previous:
                      raise SystemExit(
                          f"Plugin version {version} must be greater than base "
                          f"{base_version}"
                      )

              if os.environ.get("HEAD_REF", "").startswith(
                  "codex/skill-improvement-"
              ):
                  allowed_exact = {
                      (
                          "plugins/you-suck-at-prompting/.codex-plugin/"
                          "plugin.json"
                      ),
                      (
                          "plugins/you-suck-at-prompting/.claude-plugin/"
                          "plugin.json"
                      ),
                      (
                          "plugins/you-suck-at-prompting/skills/"
                          "you-suck-at-prompting/SKILL.md"
                      ),
                      (
                          "plugins/you-suck-at-prompting/skills/"
                          "you-suck-at-prompting/agents/openai.yaml"
                      ),
                  }
                  reference_prefix = (
                      "plugins/you-suck-at-prompting/skills/"
                      "you-suck-at-prompting/references/"
                  )
                  invalid = [
                      path
                      for path in changed
                      if path not in allowed_exact
                      and not (
                          path.startswith(reference_prefix)
                          and path.endswith(".md")
                      )
                  ]
                  if invalid:
                      raise SystemExit(
                          "Automated improvement PR changed non-release paths: "
                          + ", ".join(invalid)
                      )

          print(
              f"Validated you-suck-at-prompting {version} as a selective "
              "description-driven skill package"
          )
          PY
      - name: Run package contract tests
        run: python -B -m unittest tests.test_plugin_contract
      - name: Validate Claude Code plugin and marketplace contracts
        run: |
          claude plugin validate plugins/you-suck-at-prompting --strict
          claude plugin validate . --strict

  contract-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify selective package contract
        run: python -B -m unittest tests.test_plugin_contract
